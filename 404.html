<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Casa &amp; Zapato</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B3A2C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(1000px 600px at 50% -10%,#14503D 0%,transparent 60%),#06120E;
  color:#F5F0E4;font-family:'Inter',system-ui,sans-serif;font-weight:300}
.card{max-width:520px}
h1{font-family:'Bodoni Moda',Georgia,serif;font-size:88px;font-weight:800;margin:0;color:#E8CE7A;line-height:1}
h2{font-family:'Bodoni Moda',Georgia,serif;font-size:28px;font-weight:600;margin:14px 0 0}
p{color:#D8D2C2;font-size:17px;line-height:1.7;margin:16px 0 0}
.rule{width:70px;height:2px;background:#C9A227;margin:26px auto}
a{display:inline-block;margin-top:6px;background:linear-gradient(180deg,#E8CE7A,#C9A227);color:#241C05;
  text-decoration:none;font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:13px 24px;border-radius:2px;box-shadow:0 2px 0 #8A711C}
a:hover{filter:brightness(1.09)}
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Esta carta no está en el zapato</h2>
    <div class="rule"></div>
    <p>La página que buscas no existe o cambió de dirección. Vuelve al curso y sigue contando.</p>
    <a href="/" id="inicio">Ir al inicio</a>
  </div>
<script>
// GitHub Pages sirve esta pagina para cualquier ruta inexistente, asi que el
// enlace se calcula solo. Funciona igual en un repositorio de proyecto
// (usuario.github.io/repo/), en un dominio propio y en pruebas locales.
(function(){
  var seg = location.pathname.split('/')[1] || '';
  var esProyecto = /\.github\.io$/i.test(location.hostname) && seg && seg.indexOf('.') === -1;
  document.getElementById('inicio').href = esProyecto ? '/' + seg + '/' : '/';
})();
</script>
</body>
</html>
